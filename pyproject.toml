[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "quantumchem-ai"
version = "0.1.0"
description = "Quantum chemistry research assistant for atomic clusters"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ase>=3.23",
    "ase-ga>=1.0.3",
    "basis-set-exchange>=0.10",
    "cclib>=1.8",
    "fabric>=3.2",
    "jinja2>=3.1",
    "keyring>=25.0",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "originpro>=1.1; sys_platform == 'win32'",
    "playwright>=1.49",
    "py3Dmol>=2.4",
    "pydantic>=2.9",
    "pydantic-ai>=0.1",
    "pydantic-settings>=2.6",
    "pymatgen>=2024.10",
    "pyyaml>=6.0",
    "qtoolkit>=0.1",
    "sqlmodel>=0.0.22",
    "streamlit>=1.40",
    "typer>=0.15",
]

[project.scripts]
qcai = "qcai.cli:app"
qcai-web = "qcai.launcher:main"

[project.gui-scripts]
qcai-app = "qcai.launcher:main_gui"

[dependency-groups]
dev = [
    "hypothesis>=6.115",
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qcai", "src/qcai_remote"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*.md", "docs/spikes"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "ase.*",
    "ase_ga.*",
    "basis_set_exchange.*",
    "cclib.*",
    "custodian.*",
    "fabric.*",
    "originpro.*",
    "psutil.*",
    "py3Dmol.*",
    "pymatgen.*",
    "qtoolkit.*",
    "scipy.*",
    "tblite.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers -m 'not (remote or origin or vmd or llm)'"
markers = [
    "remote: requires real SSH or server-side software",
    "origin: requires a local Origin installation",
    "vmd: requires a local VMD installation",
    "llm: requires live DeepSeek API access",
]
